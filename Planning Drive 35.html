<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Drive 35</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout concept: phone-first app. One column, bottom tabs (Moi / Aujourd'hui / Semaine).
   Signature element: the day ribbon, a 09:00 to 03:00 track on which every shift is a bar. */
:root {
  --bg: #FFF6DC; --surface: #FFFFFF; --surface2: #FFF0C2; --ink: #2B1A14; --muted: #6B5648; --line: #F0DDA8;
  --accent: #DA291C; --accent-ink: #FFFFFF; --gold: #FFC72C;
  --matin: #FFC94D; --midi: #FF9E4A; --soir: #7CC4F5; --barink: #14182B;
  --off: #F1E8D0; --offink: #8A7757;
  --heat: #DA291C; --focus: #B71C12;
  --hero-a: #C8210F; --hero-b: #FF5A3C; --hero-ink: #FFFFFF; --hero-muted: #FFE6B3;
  --tab-bg: rgba(255,246,220,.94); --shadow: 0 1px 0 rgba(60,20,10,.05), 0 8px 24px rgba(120,40,10,.12);
  --display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E0E0B; --surface: #2D1612; --surface2: #3A1D18; --ink: #FFF1D6; --muted: #D9B99B; --line: #4A2A22;
    --off: #3D2620; --offink: #C9A98B; --tab-bg: rgba(30,14,11,.94); --shadow: 0 8px 24px rgba(0,0,0,.35);
    --hero-a: #A8190E; --hero-b: #E3342F; --focus: #FFC72C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E0E0B; --surface: #2D1612; --surface2: #3A1D18; --ink: #FFF1D6; --muted: #D9B99B; --line: #4A2A22;
  --off: #3D2620; --offink: #C9A98B; --tab-bg: rgba(30,14,11,.94); --shadow: 0 8px 24px rgba(0,0,0,.35);
  --hero-a: #A8190E; --hero-b: #E3342F; --focus: #FFC72C; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; padding-bottom: 110px; }
.tnum { font-variant-numeric: tabular-nums; }

.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; opacity: .2; }
:root[data-theme="dark"] .bg { opacity: .1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bg { opacity: .1; } }
.app { position: relative; z-index: 1; }
.hero::after { content: ""; position: absolute; right: -26px; bottom: -14px; width: 170px; height: 142px; background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20100%22%3E%0A%3Cpath%20d%3D%22M10%2046C10%2014%2030%204%2060%204s50%2010%2050%2042z%22%20fill%3D%22%23E8A33D%22/%3E%0A%3Cg%20fill%3D%22%23FFF3D0%22%3E%3Cellipse%20cx%3D%2238%22%20cy%3D%2224%22%20rx%3D%224%22%20ry%3D%222%22%20transform%3D%22rotate%28-25%2038%2024%29%22/%3E%3Cellipse%20cx%3D%2258%22%20cy%3D%2216%22%20rx%3D%224%22%20ry%3D%222%22/%3E%3Cellipse%20cx%3D%2280%22%20cy%3D%2224%22%20rx%3D%224%22%20ry%3D%222%22%20transform%3D%22rotate%2825%2080%2024%29%22/%3E%3Cellipse%20cx%3D%2250%22%20cy%3D%2234%22%20rx%3D%224%22%20ry%3D%222%22%20transform%3D%22rotate%2815%2050%2034%29%22/%3E%3Cellipse%20cx%3D%2272%22%20cy%3D%2236%22%20rx%3D%224%22%20ry%3D%222%22%20transform%3D%22rotate%28-15%2072%2036%29%22/%3E%3C/g%3E%0A%3Cpath%20d%3D%22M6%2050q9-8%2018%200t18%200%2018%200%2018%200%2018%200%2018%200v8H6z%22%20fill%3D%22%236BBF4A%22/%3E%0A%3Cpath%20d%3D%22M8%2056h104l-8%208-12-6-14%2014-14-14H8z%22%20fill%3D%22%23FFC72C%22/%3E%0A%3Crect%20x%3D%228%22%20y%3D%2266%22%20width%3D%22104%22%20height%3D%2216%22%20rx%3D%228%22%20fill%3D%22%236B3A22%22/%3E%0A%3Cpath%20d%3D%22M10%2084h100c0%2010-10%2014-20%2014H30c-10%200-20-4-20-14z%22%20fill%3D%22%23E8A33D%22/%3E%3C/svg%3E") no-repeat center / contain; opacity: .22; transform: rotate(-12deg); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #FFC72C 0 50%, #DA291C 50% 100%); flex: none; }
.brand b { font-family: var(--display); font-size: 13px; letter-spacing: .02em; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 11.5px; }
.weekpick { display: flex; gap: 6px; }
.weekpick[hidden] { display: none; }
.chip { padding: 6px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"], .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }

h1, h2, h3 { margin: 0; text-wrap: balance; }
.h-display { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; }
.label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }

/* welcome */
.welcome { display: grid; gap: 16px; padding-top: 6px; }
.welcome h1 { font-size: 27px; line-height: 1.12; }
.welcome p { margin: 0; color: var(--muted); max-width: 38ch; }
.search { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.namelist { display: grid; gap: 8px; }
.namebtn { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; font-weight: 700; }
.namebtn:active { transform: scale(.985); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: var(--barink); flex: none; }
.av-matin { background: var(--matin); } .av-midi { background: var(--midi); } .av-soir { background: var(--soir); } .av-off { background: var(--off); color: var(--offink); }
.ribbon-demo { height: 14px; border-radius: 99px; background: linear-gradient(90deg, #FFC72C, #FF9E4A 50%, #DA291C); }

/* hero (night card) */
.hero { border-radius: 24px; padding: 20px 18px 18px; color: var(--hero-ink); background: radial-gradient(120% 90% at 100% 0%, var(--hero-b), transparent 60%), var(--hero-a); position: relative; overflow: hidden; }
.hero .who { font-size: 13px; color: var(--hero-muted); font-weight: 600; }
.hero .name { font-family: var(--display); font-size: 19px; line-height: 1.2; margin-top: 2px; overflow-wrap: anywhere; }
.status { margin-top: 18px; display: grid; gap: 4px; }
.status .kicker { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: pulse 1.8s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
.status .big { font-family: var(--display); font-weight: 700; font-size: 36px; line-height: 1.05; letter-spacing: -.02em; }
.status .sub { color: var(--hero-muted); font-size: 14px; }
.progress { height: 6px; border-radius: 99px; background: rgba(255,255,255,.16); margin-top: 10px; overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--midi)); border-radius: 99px; }
.hero .swap { margin-top: 14px; font-size: 12.5px; color: var(--hero-muted); text-decoration: underline; text-underline-offset: 3px; }

.section { margin-top: 22px; display: grid; gap: 10px; }
.section > .label { padding-left: 2px; }
.summary { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-weight: 600; font-size: 13.5px; padding-left: 2px; }
.summary b { color: var(--ink); font-weight: 800; }

/* week rows with ribbon */
.week { display: grid; gap: 8px; }
.dayrow { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.dayrow[aria-pressed="true"] { border-color: var(--ink); box-shadow: var(--shadow); }
.dayrow .d { line-height: 1.1; }
.dayrow .d b { display: block; font-family: var(--display); font-size: 12px; letter-spacing: .04em; }
.dayrow .d span { font-size: 12px; color: var(--muted); font-weight: 600; }
.dayrow.today .d b::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: 1px; }
.track { position: relative; height: 30px; border-radius: 10px; background: linear-gradient(90deg, rgba(255,201,77,.22), rgba(255,158,74,.18) 40%, rgba(124,196,245,.22) 70%, rgba(91,95,214,.22)); overflow: hidden; }
.track .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .8; }
.bar { position: absolute; top: 3px; bottom: 3px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: -.03em; font-weight: 800; color: var(--barink); overflow: visible; white-space: nowrap; }
.bar.matin { background: var(--matin); } .bar.midi { background: var(--midi); } .bar.soir { background: var(--soir); }
.track.off { background: var(--off); display: grid; place-items: center; color: var(--offink); font-size: 12px; font-weight: 700; font-style: italic; }
.axis { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 0 12px; }
.axis .scale { position: relative; height: 14px; font-size: 10px; color: var(--muted); font-weight: 700; }
.axis .scale span { position: absolute; transform: translateX(-50%); }

/* colleagues */
.mates { display: grid; gap: 6px; }
.mate { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.mate b { display: block; font-size: 14px; line-height: 1.15; }
.mate small { color: var(--muted); font-size: 12px; font-weight: 600; }
.mate .t { font-size: 12.5px; font-weight: 800; }
.more { padding: 10px; border-radius: 12px; border: 1px dashed var(--line); color: var(--muted); font-weight: 700; font-size: 13px; text-align: center; }

/* badges */
.badges { display: grid; gap: 8px; }
.badge { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.badge .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(135deg, var(--gold), var(--midi)); color: #14182B; }
.badge .ico svg { width: 22px; height: 22px; }
.badge b { font-family: var(--display); font-size: 13px; line-height: 1.2; display: block; }
.badge small { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.badge.moon .ico { background: linear-gradient(135deg, #8EA2FF, #5B5FD6); color: #fff; }
.badge.clock .ico { background: linear-gradient(135deg, #7CC4F5, #4DA6E8); }
.badge.flag .ico { background: linear-gradient(135deg, #FF8A6B, var(--accent)); color: #fff; }
.holders { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.holders i { font-style: normal; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); }

/* day chips */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.daychip { flex: none; min-width: 52px; padding: 7px 6px 8px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: center; line-height: 1.1; }
.daychip b { display: block; font-family: var(--display); font-size: 11px; }
.daychip span { font-size: 12px; font-weight: 700; color: var(--muted); }
.daychip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.daychip[aria-pressed="true"] span { color: #fff; opacity: .9; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 10px 10px 11px; border-radius: 14px; text-align: left; }
.stat b { font-family: var(--display); font-size: 22px; display: block; line-height: 1.1; }
.stat span { font-size: 11.5px; font-weight: 800; letter-spacing: .04em; }
.stat.matin { background: var(--matin); color: var(--barink); } .stat.midi { background: var(--midi); color: var(--barink); } .stat.soir { background: var(--soir); color: var(--barink); }
.livebar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; font-weight: 700; }

/* gantt */
.gantt { position: relative; padding: 10px 10px 12px; }
.grow { display: grid; grid-template-columns: 128px 1fr; gap: 8px; align-items: center; padding: 3px 0; border-radius: 10px; }
.grow.me { background: color-mix(in srgb, var(--gold) 22%, transparent); }
.grow .nm { font-size: 12px; font-weight: 700; line-height: 1.15; padding-left: 4px; overflow-wrap: anywhere; }
.grow .track { height: 26px; }
.cl { display: block; width: max-content; font-style: normal; font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 99px; background: #8B1A10; color: #fff; margin-top: 2px; }
.crow { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.crow:first-child { border-top: 0; }
.crow b { font-family: var(--display); font-size: 11.5px; line-height: 1.2; }
.crow b span { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 600; }
.crow .holders { margin-top: 0; }
.crow .holders i.me { background: var(--gold); color: #14182B; border-color: var(--gold); }
.crow .none { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.closers { padding: 4px 14px; }
.grow .bar { font-size: 10.5px; top: 2px; bottom: 2px; }
.gsec { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.gsec i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.nowline { position: absolute; top: 28px; bottom: 8px; width: 2px; background: var(--accent); z-index: 2; pointer-events: none; border-radius: 2px; }
.ganttwrap { position: relative; }
.gaxis { display: grid; grid-template-columns: 128px 1fr; gap: 8px; }
.gaxis .scale { position: relative; height: 16px; font-size: 10px; color: var(--muted); font-weight: 700; }
.gaxis .scale span { position: absolute; transform: translateX(-50%); }

/* heatmap */
.heat { display: grid; grid-template-columns: 44px repeat(7, 1fr); gap: 3px; padding: 12px; }
.heat .h { font-size: 11px; font-weight: 700; color: var(--muted); display: grid; place-items: center; }
.heat .col { font-family: var(--display); font-size: 9.5px; color: var(--ink); padding-bottom: 4px; }
.cell { height: 24px; border-radius: 6px; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; background: var(--surface2); }
.cell[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.whobox { padding: 14px; }
.whobox .holders i { background: var(--surface); }
.insight { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.insight .card { padding: 12px; }
.insight b { font-family: var(--display); font-size: 15px; display: block; margin-top: 4px; line-height: 1.2; }
.insight small { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.empty { padding: 18px; text-align: center; color: var(--muted); font-weight: 600; }
.foot { margin-top: 26px; text-align: center; color: var(--muted); font-size: 12.5px; }
.foot b { color: var(--ink); }

/* podium */
.pod-head { text-align: center; padding: 8px 0 4px; }
.pod-head h1 { font-size: 22px; line-height: 1.15; }
.pod-head p { margin: 6px auto 0; color: var(--muted); max-width: 34ch; }
.podium { display: grid; grid-template-columns: 1fr 1.12fr 1fr; gap: 8px; align-items: end; margin-top: 26px; }
.pcol { display: grid; justify-items: center; text-align: center; gap: 6px; min-width: 0; }
.pav { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 16px; color: #14182B; border: 3px solid var(--surface); box-shadow: var(--shadow); }
.pcol.p1 .pav { width: 68px; height: 68px; font-size: 20px; }
.pname { font-weight: 800; font-size: 13.5px; line-height: 1.2; overflow-wrap: anywhere; padding: 0 2px; }
.pnote { font-size: 11.5px; color: var(--muted); font-weight: 600; line-height: 1.25; min-height: 1em; padding: 0 2px; }
.pcol.empty .pname { color: var(--muted); font-style: italic; font-weight: 700; }
.pblock { width: 100%; border-radius: 16px 16px 6px 6px; display: grid; place-items: start center; padding-top: 12px; font-family: var(--display); font-weight: 700; font-size: 34px; color: #14182B; position: relative; overflow: hidden; }
.pblock::after { content: ""; position: absolute; inset: 0 0 auto; height: 45%; background: linear-gradient(180deg, rgba(255,255,255,.45), transparent); }
.p1 .pblock { height: 150px; background: linear-gradient(180deg, #FFD54A, #F5A623); }
.p2 .pblock { height: 112px; background: linear-gradient(180deg, #DDE3EE, #A9B4CC); }
.p3 .pblock { height: 86px; background: linear-gradient(180deg, #F0B27A, #C9803F); }
.p1 .pav { background: #FFD54A; } .p2 .pav { background: #DDE3EE; } .p3 .pav { background: #F0B27A; }
.crown { width: 26px; height: 26px; color: #F5A623; margin-bottom: -2px; }
.pod-foot { text-align: center; margin-top: 18px; color: var(--muted); font-weight: 600; font-size: 13.5px; }
.ask.study { margin-top: 12px; }
.ask { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 14px; margin-top: 18px; }
.ask .ico { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, #FFC72C, #FF9E4A); display: grid; place-items: center; color: #2B1A14; }
.ask .ico svg { width: 24px; height: 24px; }
.ask b { font-family: var(--display); font-size: 13.5px; line-height: 1.25; display: block; }
.ask small { color: var(--muted); font-weight: 600; font-size: 12.5px; }
.ask a { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 14px; border-radius: 14px; background: #1FAF54; color: #fff; font-weight: 800; font-size: 14.5px; text-decoration: none; }
.ask a svg { width: 20px; height: 20px; }
.ask a:active { transform: scale(.985); }
/* tab bar */
.hol-now { display: flex; gap: 12px; align-items: center; padding: 11px 14px; margin-bottom: 10px; background: #FFFFFF; border: 2px solid var(--accent); }
.hol-now span { font-size: 26px; line-height: 1; }
.hol-now b { display: block; font-size: 13.5px; color: var(--accent); }
.hol-now small { color: var(--muted); font-weight: 700; font-size: 12px; }
.brow.hol .bd { background: #1B7A3A; }
.brow.hol { grid-template-columns: 52px 1fr; }
.hours2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.hours2 > div { background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; padding: 10px 12px; }
.hours2 b { display: block; font-size: 24px; font-weight: 900; color: var(--accent); line-height: 1.1; }

/* ===== Concept sombre « Drive 35 » : fond graphite, jaune comme seule couleur forte, cadran de service ===== */
:root, :root[data-theme="dark"], :root[data-theme="light"], :root:not([data-theme="light"]) {
  --bg: #121212; --surface: #1D1D1D; --surface2: #262626; --ink: #F5F2EA; --muted: #A9A49A; --line: #2E2E2E;
  --accent: #FFC72C; --accent-ink: #161310; --gold: #FFC72C;
  --matin: #FFC72C; --midi: #F7953B; --soir: #6FB6F2; --barink: #161310;
  --off: #242424; --offink: #A9A49A; --heat: #FFC72C; --focus: #FFC72C; --live: #E5484D; --wa: #1F8F4E;
  --hero-ink: #F5F2EA; --hero-muted: #A9A49A;
  --tab-bg: transparent; --shadow: none;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); }
body::before { background: var(--bg); }
.bg, .hero::after { display: none; }
.card { background: var(--surface); border: 0; border-radius: 20px; box-shadow: none; }
.label { color: var(--muted); letter-spacing: .14em; }
.chip, .langbtn, .namebtn, .search { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.langbtn { border-radius: 999px; }
.chip[aria-pressed="true"], .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* cadran */
.hero { background: none; color: var(--ink); padding: 4px 0 0; border-radius: 0; overflow: visible; }
.hello { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hello small { font-size: 12px; color: var(--muted); font-weight: 700; }
.hero .name { font-family: var(--display); font-size: 24px; font-weight: 700; margin-top: 2px; line-height: 1.15; }
.dial { position: relative; width: min(270px, 78vw); aspect-ratio: 1; max-width: 100%; margin: 18px auto 4px; }
.dial svg { width: 100%; height: 100%; display: block; overflow: visible; }
.dial text { fill: var(--muted); font-size: 7px; font-weight: 700; font-family: var(--body); }
.dial .ctr { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; padding: 0 18%; }
.dial .kicker { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #3DD68C; }
.dial .kicker.wait { color: var(--accent); } .dial .kicker.done { color: var(--muted); }
.dial .big { font-family: var(--display); font-size: clamp(30px, 10vw, 42px); font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
.dial .sub { font-size: 12.5px; color: var(--muted); font-weight: 600; line-height: 1.35; }
.pulse { background: #3DD68C; }
.hero .swap { display: block; margin: 6px auto 0; color: var(--muted); }
html[dir="rtl"] .dial .big, html[dir="rtl"] .dial svg { direction: ltr; }

/* semaine en colonnes */
.wk { padding: 14px 12px 12px; }
.wkhd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wkhd b { font-family: var(--display); font-weight: 700; }
.wkgrid { display: grid; grid-template-columns: 22px repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 10px; direction: ltr; }
.wkhead { text-align: center; font-size: 10.5px; font-weight: 800; color: var(--muted); line-height: 1.2; padding: 4px 0; border-radius: 10px; }
.wkhead span { display: block; font-size: 13px; color: var(--ink); }
.wkhead.today { background: var(--accent); color: var(--accent-ink); }
.wkhead.today span { color: var(--accent-ink); }
.wkax { position: relative; height: 210px; }
.wkax span { position: absolute; left: 0; transform: translateY(-50%); font-size: 9.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.wcol { position: relative; height: 210px; border-radius: 12px; background: var(--surface2); min-width: 0; padding: 0; }
.wcol[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.wcol.today { box-shadow: inset 0 0 0 2px var(--accent); }
.wcol .blk { position: absolute; left: 3px; right: 3px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 9.5px; font-weight: 800; color: var(--barink); font-variant-numeric: tabular-nums; overflow: hidden; }
.blk.matin { background: var(--matin); } .blk.midi { background: var(--midi); } .blk.soir { background: var(--soir); }
.wcol .rp { position: absolute; inset: 0; display: grid; place-items: center; }
.wcol .rp span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10.5px; font-weight: 800; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.wcol .nowl { position: absolute; left: -2px; right: -2px; height: 2px; background: var(--live); border-radius: 2px; }
.wcol .nowl::before { content: ""; position: absolute; left: -2px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.wleg { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 11px; font-weight: 700; color: var(--muted); }
.wleg i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }

/* collègues */
.crew { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }

.avatar { color: var(--barink); }

/* livraison, contact, badges */
.deliv { background: var(--surface); border: 0; }
.ask { background: var(--surface); }
.ask .ico { background: var(--wa); color: #fff; }
.ask a { background: var(--wa); border-radius: 999px; }
.badge { background: var(--surface); border: 0; }

/* vue jour */
.daychip { background: transparent; border: 1.5px solid var(--line); border-radius: 999px; color: var(--ink); }
.daychip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.daychip[aria-pressed="true"] span { color: var(--accent-ink); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.tiles > div { background: var(--surface); border-radius: 20px; padding: 14px; }
.tiles b { display: block; font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.05; }
.tiles span { font-size: 12px; color: var(--muted); font-weight: 700; }
.tiles .pk { background: var(--soir); color: #0C1A28; }
.tiles .pk span { color: #0C1A28; }
.hourly { padding: 14px; margin-top: 10px; }
.hourly .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hourly .hd small { font-size: 11px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 5px; }
.hourly .hd small i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.hr { display: grid; grid-template-columns: 54px 1fr 22px; align-items: center; gap: 8px; padding: 5px 6px; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hr .t { display: flex; align-items: center; gap: 6px; }
.hr .t i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.hr.mine .t i { background: var(--accent); }
.hr .tr { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.hr .tr i { display: block; height: 100%; border-radius: 99px; background: var(--midi); }
.hr.eve .tr i { background: var(--soir); } .hr.am .tr i { background: var(--matin); }
.hr .n { text-align: end; }
.hr.now { border: 1.5px solid var(--accent); border-radius: 14px; margin: 4px 0; padding: 8px 6px; grid-template-columns: 54px 1fr 22px; }
.hr.now .who { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.hr.now .tag { font-size: 10px; font-weight: 800; letter-spacing: .08em; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 3px 8px; }
.pill { font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--surface2); color: var(--ink); }
.pill.me { background: var(--accent); color: var(--accent-ink); }
.closers { padding: 14px; margin-top: 10px; }
.closers .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.stat { background: var(--surface); border: 0; border-radius: 16px; }
.livebar { background: var(--surface); }
.track { background: var(--surface2); }
.track.off { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); }
.grow.me { background: rgba(255,199,44,.1); }
.cl { background: var(--accent); color: var(--accent-ink); }
.nowline { background: var(--live); }
.hours2 > div { background: var(--surface); border: 0; }
.bday-now, .hol-now { background: var(--surface); border: 0; }
.mgrbar { background: var(--surface); color: var(--ink); }

/* barre d'onglets en pilule */
.tabs { background: transparent; border-top: 0; backdrop-filter: none; -webkit-backdrop-filter: none; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.tabs > div { background: var(--surface); border-radius: 999px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 500px; }
.tab { color: var(--muted); border-radius: 999px; min-height: 48px; align-content: center; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* accueil, pop-ups */
#gate { background: var(--bg); }
.bdbox { background: var(--surface); }
#gate .gbtn { background: var(--surface2); color: var(--ink); border-color: var(--line); }
#gate .gbtn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#mgrpop input { background: var(--surface2); color: var(--ink); }

/* Prévisions (managers) */
.pv-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pv-top > div { background: var(--surface); border-radius: 20px; padding: 14px; min-width: 0; }
.pv-top .hl { background: var(--accent); color: var(--accent-ink); }
.pv-top .hl span, .pv-top .hl small { color: var(--accent-ink); }
.pv-top b { display: block; font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pv-top span { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pv-top small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.up { color: #3DD68C; } .down { color: #FF7A7F; }
.pv-top .hl .up, .pv-top .hl .down { color: var(--accent-ink); }
.pv-wk { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; margin-top: 14px; }
.pv-wk button { flex: 0 0 auto; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--ink); font-weight: 800; font-size: 13px; }
.pv-wk button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pv-card { padding: 14px; margin-top: 10px; }
.pv-sum { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.pv-sum b { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pv-sum small { color: var(--muted); font-weight: 700; font-size: 12px; }
.pv-chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 150px; margin-top: 14px; }
.pv-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.pv-col .v { font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums; }
.pv-bars { display: flex; gap: 2px; align-items: flex-end; width: 100%; justify-content: center; flex: 1; }
.pv-bars i { display: block; width: 42%; border-radius: 5px 5px 2px 2px; }
.pv-bars .n1 { background: #4A4A4A; } .pv-bars .pr { background: var(--accent); }
.pv-col.today .d { background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 0 5px; }
.pv-col .d { font-size: 11px; font-weight: 800; color: var(--muted); }
.pv-leg { display: flex; gap: 14px; margin-top: 10px; font-size: 11.5px; font-weight: 700; color: var(--muted); flex-wrap: wrap; }
.pv-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
.pv-tw { overflow-x: auto; margin-top: 10px; }
.pv-t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 460px; }
.pv-t th { text-align: end; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 6px 6px; border-bottom: 1px solid var(--line); }
.pv-t th:first-child, .pv-t td:first-child { text-align: start; }
.pv-t td { text-align: end; padding: 9px 6px; border-bottom: 1px solid var(--line); }
.pv-t td:first-child b { display: block; font-size: 13px; }
.pv-t td:first-child small { color: var(--muted); font-size: 11px; }
.pv-t tr.today td { background: rgba(255,199,44,.1); }
.pv-t .ca { font-weight: 800; }
.pv-note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.45; }
html[dir="rtl"] .pv-chart, html[dir="rtl"] .pv-top b, html[dir="rtl"] .pv-sum b { direction: ltr; }

  const D = state.mgr && state.mgr.delivery, hmap = {};
  HOLIDAYS.forEach(([d, n, est]) => { const [hy, hm2, hd] = d.split("-").map(Number); if (hy === y && hm2 - 1 === m) (hmap[hd] = hmap[hd] || []).push({ n, est }); });
  let cells = DN.map(x => `<div class="dn">${x}</div>`).join("") + '<div class="c e"></div>'.repeat(lead);
  for (let d = 1; d <= nd; d++) {
    const dow = new Date(Date.UTC(y, m, d)).getUTCDay(), isT = y === ty && m === tm && d === now.getUTCDate();
    cells += `<div class="c ${hmap[d] ? "hol" : ""} ${isT ? "today" : ""}">${d}${D && D.dow.includes(dow) ? '<span class="tr">🚚</span>' : ""}</div>`;
  }
  const minOk = y > 2026 || m > 9, maxOk = y < 2027 || m < 11;
  const list = Object.keys(hmap).map(Number).sort((a, b) => a - b).map(d => hmap[d].map(h => `<div class="brow hol"><div class="bd"><b>${d}</b><span>${mAb(m + 1)}</span></div><div class="bn"><b>${esc(h.n)}</b><small>${DOWL[new Date(Date.UTC(y, m, d)).getUTCDay()]}${h.est ? L(" · date estimée", " · تاريخ تقريبي") : ""}</small></div></div>`).join("")).join("");
  return `<section class="rise"><div class="pod-head"><div class="label">${L("Espace managers", "فضاء المدراء")}</div><h1 class="h-display">${L("Calendrier", "التقويم")}</h1></div>
    <div class="card cal"><div class="calhead"><button type="button" data-cal="-1" ${minOk ? "" : "disabled"} aria-label="‹">‹</button><b>${MONTHS[m][0].toUpperCase() + MONTHS[m].slice(1)} ${y}</b><button type="button" data-cal="1" ${maxOk ? "" : "disabled"} aria-label="›">›</button></div>
      <div class="calgrid">${cells}</div>
      <div class="callegend"><span><i></i>${L("Jour férié", "عطلة رسمية")}</span><span>🚚 ${L("Livraison", "التوصيل")}</span></div></div>
    <div class="section"><div class="label">${L("Jours fériés du mois", "عطل الشهر")}</div>${list ? `<div class="card bdays">${list}</div>` : `<div class="empty card">${L("Aucun jour férié ce mois-ci.", "لا توجد عطلة رسمية هذا الشهر.")}</div>`}</div>
    <p class="holnote">${L("Les fêtes religieuses (Aïd, Moharram, Mawlid) dépendent de l'observation de la lune : les dates sont confirmées par le ministère des Habous.", "الأعياد الدينية (العيدان، محرم، المولد) تتبع رؤية الهلال، وتُعلن تواريخها وزارة الأوقاف.")}</p></section>`;
}
function viewMinfo() {
  const D = state.mgr.delivery, S = state.mgr.support || [];
  const when = x => x.k === 0 ? L("Aujourd'hui", "اليوم") : x.k === 1 ? L("Demain", "غدا") : `${DOWL[x.dow][0].toUpperCase() + DOWL[x.dow].slice(1)} ${x.d} ${MONTHS[x.m]}`;
  const dl = D ? nextDeliveries(4).map(x => `<div class="brow hol"><div class="bd"><b>${x.d}</b><span>${mAb(x.m + 1)}</span></div><div class="bn"><b>🚚 ${L("Livraison", "التوصيل")} · ${I(D.time)}</b><small>${when(x)}</small></div></div>`).join("") : "";
  const sup = S.map(s => `<div class="card sup"><b>${esc(s.n)}</b><div class="roles">${s.r.map(r => `<i>${esc(r)}</i>`).join("")}</div></div>`).join("");
  return `<section class="rise"><div class="pod-head"><div class="label">${L("Espace managers", "فضاء المدراء")}</div><h1 class="h-display">${L("Infos du restaurant", "معلومات المطعم")}</h1></div>
    <div class="section"><div class="label">${L("Prochaines livraisons · mardi et vendredi", "التوصيلات القادمة · الثلاثاء والجمعة")}</div><div class="card bdays">${dl}</div></div>
    <div class="section"><div class="label">${L("Responsables des systèmes de soutien", "المسؤولون عن أنظمة الدعم")}</div>${sup}</div>
</section>`;
}
function viewBday() {
  return `<section class="rise"><div class="pod-head"><div class="label">Équipe de Khouribga</div><h1 class="h-display">Fêtes &amp; anniversaires 🎂</h1>
    <p>Les anniversaires de la semaine du ${dateOf(0).d} au ${dateOf(6).d} ${dateOf(6).m}.</p></div>${bdayCard()}${holCard()}</section>`;
}
function bdayPop() {
  const old = document.getElementById("bdpop"); if (old) return;
  const g0 = document.getElementById("gate"); if (g0 && g0.dataset.step === "1") return;
  const ds = new Date(nowWall() - 300 * MIN).toISOString().slice(0, 10);
  let t = bdays().filter(b => b.today);
  if (!t.length) t = (DATA.birthdays || []).filter(b => b && b.msg && b.from && ds >= b.from && ds <= b.until);
  if (!t.length) return;
  const key = "d35.bd." + ds;
  try { if (localStorage.getItem(key)) return; } catch (e) {}
  const el = document.createElement("div"); el.id = "bdpop";
  el.innerHTML = `<div class="bdbox"><div class="bdemoji">🎂🎉🎈</div><small>${t[0].today ? "Anniversaire aujourd'hui" : L("Anniversaire le ", "عيد ميلاد يوم ") + t[0].d + " " + mAb(t[0].m)}</small><h2>${t.map(b => esc(title(b.n))).join(" & ")}</h2><p>${t.length === 1 && t[0].msg ? esc(L(t[0].msg, t[0].msgAr || t[0].msg)) : "Toute l'équipe de Khouribga te souhaite un joyeux anniversaire !"}</p>
    <a class="wish big" href="${wishUrl(t[0])}" target="_blank" rel="noopener">🎁 Envoyer un message</a><button class="bdclose" type="button">Fermer</button></div>`;
  el.addEventListener("click", e => { if (e.target.id === "bdpop" || e.target.classList.contains("bdclose")) { try { localStorage.setItem(key, "1"); } catch (x) {} el.remove(); } });
  document.body.appendChild(el); trTree(el);
}
function viewStars() {
  const st = DATA.stars || {}, pod = st.podium || [];
  const col = (rank) => {
    const x = pod[rank - 1] && pod[rank - 1].n ? pod[rank - 1] : null;
    return `<div class="pcol p${rank} ${x ? "" : "empty"}">
      ${rank === 1 ? '<svg class="crown" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></svg>' : ""}
      <div class="pav">${x ? initials(title(x.n)) : "?"}</div>
      <div class="pname">${x ? esc(title(x.n)) : "À annoncer"}</div>
      <div class="pnote">${x && x.note ? esc(x.note) : ""}</div>
      <div class="pblock">${rank}</div></div>`;
  };
  const any = pod.some(x => x && x.n);
  return `<section class="rise">
    <div class="pod-head"><div class="label">${esc(st.month || "")}</div><h1 class="h-display">Meilleurs équipiers du mois</h1>
      <p>${any ? "Bravo à celles et ceux qui font briller le Drive 35." : "Le podium du mois sera annoncé très bientôt."}</p></div>
    <div class="podium">${col(2)}${col(1)}${col(3)}</div>
    <p class="pod-foot">${any ? "Merci pour votre énergie, votre sourire et votre sérieux." : "Qui montera sur le podium ?"}</p></section>`;
}
/* ---------- render ---------- */
function render() {
  if (!DATA.mgr) { const mt = document.querySelector('.tab[data-tab="mgr"]'); if (mt) { mt.remove(); document.querySelector(".tabs > div").style.gridTemplateColumns = "repeat(5, 1fr)"; } }
  weekOf();
  const d0 = dateOf(0), d6 = dateOf(6);
  document.getElementById("weeklabel").textContent = `${L("Khouribga", "خريبكة")} · ${d0.d} – ${d6.d} ${d6.m}`;
  const wp = document.getElementById("weekpick");
  wp.hidden = wl().length < 2;
  wp.innerHTML = wl().map((w, i) => `<button class="chip" data-week="${i}" aria-pressed="${i === state.wi}">${w.short}</button>`).join("");
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === state.tab));
  const v = document.getElementById("view");
  const inner = state.tab === "day" ? viewDay() : (state.mgr && state.tab === "team") ? viewDay(true) : state.tab === "week" ? viewWeek() : state.tab === "stars" ? viewStars() : state.tab === "bday" ? viewBday() : (state.mgr && state.tab === "minfo") ? viewMinfo() : (state.mgr && state.tab === "mcal") ? viewMcal() : (state.mgr && state.tab === "mpos") ? viewPostes() : (state.mgr && state.tab === "mprev") ? viewPrev() : (me() ? viewMe() : viewWelcome());
  v.innerHTML = (state.mgr ? "" : bdayBanner()) + holBanner() + inner;
  if (!state.mgr) bdayPop();
  document.querySelector(".tabs").classList.toggle("mgrmode", !!state.mgr);
  document.getElementById("mgrbar").hidden = !state.mgr;
  document.getElementById("foot").innerHTML = L(`Planning de la semaine du <b>${d0.d} ${d0.m}</b> · mis à jour le ${W.updated}<br>Merci à toute l'équipe du Drive 35.`, `جدول الأسبوع ابتداء من <b>${d0.d} ${d0.m}</b> · آخر تحديث ${I(String(W.updated).replace(" à ", " – "))}<br>شكرا لكل فريق Drive 35.`);
  trTree(document.body);
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "langbtn") { lang = lang === "ar" ? "fr" : "ar"; ls.set("d35.lang", lang); applyLang(); render(); return; }
  if (t.dataset.tab === "mgr") { mgrAsk(); return; }
  if (t.dataset.pday) { state.pd = +t.dataset.pday; render(); return; }
  if (t.dataset.pvw) { state.pvw = +t.dataset.pvw; render(); return; }
  if (t.dataset.pf) { state.pf = t.dataset.pf; render(); return; }
  if (t.dataset.cal) { state.cal.m += +t.dataset.cal; if (state.cal.m < 0) { state.cal.m = 11; state.cal.y--; } if (state.cal.m > 11) { state.cal.m = 0; state.cal.y++; } render(); return; }
  if (t.id === "mgrquit") { state.mgr = null; state.wi = state.prevWi || 0; state.tab = "me"; state.daySel = null; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; ls.set("d35.tab", state.tab); render(); window.scrollTo(0, 0); }
  else if (t.dataset.pick) { state.me = t.dataset.pick; ls.set("d35.me", state.me); state.selDay = null; state.q = ""; render(); window.scrollTo(0, 0); }
  else if (t.dataset.act === "swap") { state.me = ""; ls.set("d35.me", ""); state.selDay = null; render(); window.scrollTo(0, 0); }
  else if (t.dataset.act === "more") { state.showAll = !state.showAll; render(); }
  else if (t.dataset.day) { state.selDay = +t.dataset.day; state.showAll = false; render(); }
  else if (t.dataset.dsel) { state.daySel = +t.dataset.dsel; render(); }
  else if (t.dataset.heat) { const [i, h] = t.dataset.heat.split(",").map(Number); state.heat = (state.heat && state.heat.i === i && state.heat.h === h) ? null : { i, h }; render(); }
  else if (t.dataset.week) { state.wi = +t.dataset.week; state.selDay = null; state.daySel = null; state.heat = null; render(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "pq") { state.pq = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("pq"); q.focus(); q.setSelectionRange(pos, pos); return; }
  if (e.target.id === "q") { state.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById("q"); q.focus(); q.setSelectionRange(pos, pos); }
});
function gate(step) {
  let el = document.getElementById("gate");
  if (!el) { el = document.createElement("div"); el.id = "gate"; document.body.appendChild(el); }
  const close = () => { el.remove(); }; el.dataset.step = step;
  if (step === 1) {
    el.innerHTML = `<div class="bdbox"><div class="gbrand">DRIVE 35 · KHOURIBGA</div><div class="bdemoji">🍔</div><h2>Bienvenue · مرحبا</h2><p>Choisis ta langue · اختر لغتك</p>
      <button class="gbtn main" data-gl="fr">Français</button><button class="gbtn" data-gl="ar">العربية</button></div>`;
    el.querySelectorAll("[data-gl]").forEach(b => b.addEventListener("click", () => {
      lang = b.dataset.gl; ls.set("d35.lang", lang); applyLang(); render(); gate(2); bdayPop(); { const bp = document.getElementById("bdpop"); if (bp) document.body.appendChild(bp); }
    }));
  } else {
    el.innerHTML = `<div class="bdbox"><div class="gbrand">DRIVE 35 · KHOURIBGA</div><div class="bdemoji">👋</div><h2>${L("Tu es ?", "أنت ؟")}</h2><p>${L("Choisis ton espace.", "اختر فضاءك.")}</p>
      <button class="gbtn main" data-gr="team">${L("Équipier", "موظف")}<small>${L("Voir mon planning", "شاهد جدولي")}</small></button>
      <button class="gbtn" data-gr="mgr">${L("Manager", "مدير")}<small>${L("Accès avec un code", "الدخول برمز")}</small></button>
      <button class="bdclose" data-gr="back">${L("← Changer de langue", "← تغيير اللغة")}</button></div>`;
    el.querySelectorAll("[data-gr]").forEach(b => b.addEventListener("click", () => {
      const r = b.dataset.gr;
      if (r === "back") { gate(1); return; }
      close(); window.scrollTo(0, 0); ls.set("d35.role", r);
      if (r === "mgr") mgrAsk();
    }));
  }
}
applyLang();
render();
{ const role = ls.get("d35.role"), sl = ls.get("d35.lang");
  if (role === "team" && sl) { /* choix déjà fait */ } else if (role === "mgr" && sl) mgrAsk(); else gate(1); }
setInterval(() => { if (state.tab !== "week" && state.tab !== "stars" && state.tab !== "bday" && !(state.tab === "me" && !me())) { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 30000);
</script>
