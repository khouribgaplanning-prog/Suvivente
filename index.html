<style>
:root{--bg:#e9efec;--surface:#fff;--ink:#0d1b20;--ink2:#43585e;--line:rgba(13,27,32,.18);--acc:#0d1b20;--onacc:#eaf1ee;--bad:#c22f2f;--s1:#c4741a;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px))}

form{display:flex;flex-direction:column;gap:10px}

button{font:inherit;font-weight:700;background:var(--acc);color:var(--onacc);border:0;border-radius:99px;min-height:50px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#show{background:transparent;color:var(--ink);border:1px solid var(--line);min-height:44px;font-weight:600;font-size:14px}

  function cat(){var n=0,i;for(i=0;i<arguments.length;i++)n+=arguments[i].length;var r=new Uint8Array(n),o=0;for(i=0;i<arguments.length;i++){r.set(arguments[i],o);o+=arguments[i].length;}return r;}
  function pbkdf2(pw,salt,iter,len){
    var p=pads(pw),out=new Uint8Array(Math.ceil(len/32)*32);
    for(var b=1;b<=Math.ceil(len/32);b++){
      var u=hmac(p,cat(salt,new Uint8Array([b>>>24,b>>>16,b>>>8,b]))),t=u.slice();
      for(var i=1;i<iter;i++){u=hmac(p,u);for(var j=0;j<32;j++)t[j]^=u[j];}
      out.set(t,(b-1)*32);
    }
    return out.subarray(0,len);
  }
  function utf8(s){if(window.TextEncoder)return new TextEncoder().encode(s);var e=unescape(encodeURIComponent(s)),u=new Uint8Array(e.length);for(var i=0;i<e.length;i++)u[i]=e.charCodeAt(i);return u;}
  function unutf8(u){if(window.TextDecoder)return new TextDecoder().decode(u);var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return decodeURIComponent(escape(s));}
  function open(code){
    var km=pbkdf2(utf8(code),b64(SALT),ITER,64),ek=pads(km.subarray(0,32)),mk=pads(km.subarray(32)),iv=b64(IV),d=b64(DATA);
    var tag=d.subarray(0,32),ct=d.subarray(32);
    var t=hmac(mk,cat(iv,ct)),ok=0;for(var i=0;i<32;i++)ok|=t[i]^tag[i];
    if(ok)throw new Error('bad');
    var pt=new Uint8Array(ct.length);
    for(var o=0,c=0;o<ct.length;o+=32,c++){var ks=hmac(ek,cat(iv,new Uint8Array([c>>>24,c>>>16,c>>>8,c])));for(var j=0;j<32&&o+j<ct.length;j++)pt[o+j]=ct[o+j]^ks[j];}
    return unutf8(pt);
  }
  function show(html){document.open();document.write(html);document.close();}
  function submit(code,silent){
    code=code.trim(); if(!code) return;
    $('#go').disabled=true; err('Déverrouillage en cours… patientez quelques secondes.');
    setTimeout(function(){
      try{
        var html=open(code);
        try{sessionStorage.setItem('sv-code',code);}catch(e){}
        show(html);
      }catch(e){
        $('#go').disabled=false;
        try{sessionStorage.removeItem('sv-code');}catch(x){}
        err(silent?'':(e&&e.message==='bad'?'Code incorrect.':'Erreur : '+(e&&e.message||e)));
        $('#code').select();
      }
    },60);
  }
  $('#f').addEventListener('submit',function(e){e.preventDefault();});
  $('#go').addEventListener('click',function(){submit($('#code').value,false);});
  $('#code').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit($('#code').value,false);}});
  var saved=null; try{saved=sessionStorage.getItem('sv-code');}catch(e){}
  if(saved) submit(saved,true);
})();
</script>
