  var $=function(s){return document.querySelector(s)};
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function err(t){$('#err').textContent=t;}
  async function open(code){
    if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
    return new TextDecoder().decode(buf);
  }
  function show(html){document.open();document.write(html);document.close();}
  async function submit(code,silent){
    code=code.trim().toUpperCase(); if(!code) return;
    $('#go').disabled=true; err('');
    try{
      var html=await open(code);
      try{sessionStorage.setItem('sv-code',code);}catch(e){}
      show(html);
    }catch(e){
      $('#go').disabled=false;
      try{sessionStorage.removeItem('sv-code');}catch(x){}
      if(!silent) err(e&&e.message==='nocrypto'?'Ce navigateur ne peut pas déverrouiller la page. Ouvre-la en https.':'Code incorrect.');
      $('#code').select();
    }
  }
  $('#f').addEventListener('submit',function(e){e.preventDefault();submit($('#code').value,false);});
  var saved=null; try{saved=sessionStorage.getItem('sv-code');}catch(e){}
  if(saved) submit(saved,true);
})();
</script>
